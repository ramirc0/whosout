[package]
name = "whosout"
version = "0.0.0"
publish = false
description = "Calendar of who is out, read from a Slack status channel"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive"] }
jiff = { version = "1.0.3", features = ["serde"] }
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
toml = "1.2.2"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
